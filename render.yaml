services:
  # Backend Web Service
  - type: web
    name: blog-app-backend
    env: node
    rootDir: blog-app-backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # You can add other environment variables in the Render Dashboard

  # Frontend Static Site
  - type: static
    name: blog-app-frontend
    rootDir: blog-app-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # This rewrite rule is necessary for React Router to work correctly on reload
      - type: rewrite
        source: /*
        destination: /index.html
